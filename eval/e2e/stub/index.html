<body>
<h3>nazra e2e STUB (not the real engine)</h3>
<video id="v" playsinline muted autoplay></video><canvas id="c" width="640" height="480"></canvas>
<pre id="out">loading...</pre>
<script>
// Standalone stand-in for the app's /#/scan-test page. It proves the fake-camera plumbing:
// getUserMedia -> canvas -> mean green of the centre region (+ row-profile shift) -> FFT.
// It sets window.__nazraE2E in the same shape the real page is contracted to expose.
(function () {
  const params = new URLSearchParams((location.hash.split('?')[1] || '') || location.search.slice(1));
  const SECONDS = Math.max(5, Number(params.get('seconds')) || 30);
  const E = (window.__nazraE2E = {
    status: 'loading', progress: 0, error: null,
    vitals: { hr_bpm: null, hr_confidence: null, rr_bpm: null, rr_confidence: null,
              hrv_rmssd_ms: null, hrv_sdnn_ms: null, stress_index: null, quality: null, fps: null, scan_seconds: SECONDS },
    stub: true,
  });
  const out = document.getElementById('out');
  const log = (m) => { out.textContent = m; };

  // ---- tiny DSP ----
  function fft(re, im) {                       // in-place radix-2
    const n = re.length;
    for (let i = 1, j = 0; i < n; i++) {
      let bit = n >> 1;
      for (; j & bit; bit >>= 1) j ^= bit;
      j ^= bit;
      if (i < j) { [re[i], re[j]] = [re[j], re[i]]; [im[i], im[j]] = [im[j], im[i]]; }
    }
    for (let len = 2; len <= n; len <<= 1) {
      const ang = -2 * Math.PI / len, wr = Math.cos(ang), wi = Math.sin(ang);
      for (let i = 0; i < n; i += len) {
        let cr = 1, ci = 0;
        for (let k = 0; k < len / 2; k++) {
          const a = i + k, b = i + k + len / 2;
          const xr = re[b] * cr - im[b] * ci, xi = re[b] * ci + im[b] * cr;
          re[b] = re[a] - xr; im[b] = im[a] - xi; re[a] += xr; im[a] += xi;
          const t = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = t;
        }
      }
    }
  }
  function resample(t, x, fs) {
    const n = Math.floor((t[t.length - 1] - t[0]) * fs) + 1, u = new Float64Array(n);
    let j = 0;
    for (let i = 0; i < n; i++) {
      const tt = t[0] + i / fs;
      while (j < t.length - 2 && t[j + 1] < tt) j++;
      const a = Math.min(Math.max((tt - t[j]) / ((t[j + 1] - t[j]) || 1), 0), 1);
      u[i] = x[j] + (x[j + 1] - x[j]) * a;
    }
    return u;
  }
  function peak(t, x, lo, hi) {                // returns {hz, conf}; conf = peak / mean in band
    const fs = 30, u = resample(t, x, fs), n = u.length;
    let m = 0; for (const v of u) m += v; m /= n;
    // remove slow trend (moving average ~ 2 s) so baseline wander does not dominate
    const w = Math.round(2 * fs), cs = new Float64Array(n + 1);
    for (let i = 0; i < n; i++) cs[i + 1] = cs[i] + u[i];
    const nfft = 1 << 15, re = new Float64Array(nfft), im = new Float64Array(nfft);
    for (let i = 0; i < n; i++) {
      const a = Math.max(0, i - (w >> 1)), b = Math.min(n, i + (w >> 1) + 1);
      const trend = (lo > 0.5) ? (cs[b] - cs[a]) / (b - a) : m;
      re[i] = (u[i] - trend) * (0.5 - 0.5 * Math.cos(2 * Math.PI * i / (n - 1)));
    }
    fft(re, im);
    let best = 0, bi = 0, sum = 0, cnt = 0;
    for (let k = 1; k < nfft / 2; k++) {
      const f = k * fs / nfft; if (f < lo || f > hi) continue;
      const mag = Math.hypot(re[k], im[k]); sum += mag; cnt++;
      if (mag > best) { best = mag; bi = k; }
    }
    return { hz: bi * fs / nfft, conf: best / (sum / cnt) };
  }

  async function main() {
    const v = document.getElementById('v'), c = document.getElementById('c');
    const ctx = c.getContext('2d', { willReadFrequently: true });
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, frameRate: 30 }, audio: false });
    v.srcObject = stream; v.muted = true;
    await v.play();
    const W = 640, H = 480;
    // centre ROI (mostly forehead / cheeks / nose of the synthetic portrait)
    const rx0 = Math.round(W * 0.38), rx1 = Math.round(W * 0.62), ry0 = Math.round(H * 0.28), ry1 = Math.round(H * 0.55);
    // row-profile columns (central half of the frame)
    const cx0 = Math.round(W * 0.25), cx1 = Math.round(W * 0.75);
    const T = [], G = [], PROF = [];
    let t0 = null, frames = 0, finished = false;

    function sample(nowMs) {
      if (finished) return;
      if (v.videoWidth === 0) return;
      ctx.drawImage(v, 0, 0, W, H);
      const d = ctx.getImageData(0, 0, W, H).data;
      let g = 0, n = 0;
      for (let y = ry0; y < ry1; y++) for (let x = rx0; x < rx1; x++) { g += d[(y * W + x) * 4 + 1]; n++; }
      const prof = new Float32Array(H);
      for (let y = 0; y < H; y++) { let s = 0; for (let x = cx0; x < cx1; x++) s += d[(y * W + x) * 4 + 1]; prof[y] = s / (cx1 - cx0); }
      if (t0 === null) { t0 = nowMs; E.status = 'running'; }
      const t = (nowMs - t0) / 1000;
      T.push(t); G.push(g / n); PROF.push(prof); frames++;
      E.progress = Math.min(1, t / SECONDS);
      if (t >= SECONDS) finish();
    }
    function schedule() {
      if (finished) return;
      if (v.requestVideoFrameCallback) v.requestVideoFrameCallback((now) => { sample(now); schedule(); });
      else requestAnimationFrame((now) => { sample(now); schedule(); });
    }
    schedule();

    function finish() {
      finished = true;
      const dur = T[T.length - 1] - T[0];
      const hr = peak(T, G, 0.7, 3.0);
      // vertical shift of each frame's row profile vs the mean profile (xcorr + parabola), then FFT in 0.1-0.7 Hz
      const H_ = PROF[0].length, ref = new Float64Array(H_);
      for (const p of PROF) for (let i = 0; i < H_; i++) ref[i] += p[i] / PROF.length;
      const z = (a) => { let m = 0; for (const x of a) m += x; m /= a.length; let s = 0; for (const x of a) s += (x - m) ** 2; s = Math.sqrt(s / a.length) || 1; return Array.from(a, (x) => (x - m) / s); };
      const zr = z(ref), m = 12, lags = []; for (let l = -8; l <= 8; l++) lags.push(l);
      const shifts = PROF.map((p) => {
        const zp = z(p), cc = lags.map((L) => { let s = 0; for (let i = m; i < H_ - m; i++) s += zp[i] * zr[(i + L + H_) % H_]; return s; });
        let j = cc.indexOf(Math.max(...cc)); j = Math.min(Math.max(j, 1), cc.length - 2);
        const den = cc[j - 1] - 2 * cc[j] + cc[j + 1];
        return lags[j] + (den ? 0.5 * (cc[j - 1] - cc[j + 1]) / den : 0);
      });
      const rr = peak(T, shifts, 0.1, 0.7);
      Object.assign(E.vitals, {
        hr_bpm: +(hr.hz * 60).toFixed(2), hr_confidence: +hr.conf.toFixed(2),
        rr_bpm: +(rr.hz * 60).toFixed(2), rr_confidence: +rr.conf.toFixed(2),
        quality: +Math.min(1, hr.conf / 10).toFixed(2), fps: +(frames / dur).toFixed(2), scan_seconds: +dur.toFixed(2),
      });
      E.progress = 1; E.status = 'done';
      log('DONE\n' + JSON.stringify(E.vitals, null, 2));
      stream.getTracks().forEach((tr) => tr.stop());
    }
    setInterval(() => { if (!finished) log(`status=${E.status} progress=${E.progress.toFixed(2)} frames=${frames}`); }, 500);
  }
  main().catch((e) => { E.status = 'error'; E.error = String(e && e.name ? e.name + ': ' + e.message : e); log('ERROR ' + E.error); });
})();
</script>
